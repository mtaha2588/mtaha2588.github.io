<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="78%" cy="42%" r="55%">
      <stop offset="0" stop-color="#ff1f35" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#b3121f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3347"/>
      <stop offset="1" stop-color="#ff8a94"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c9c9cf" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- globe -->
  <g transform="translate(1000 300) scale(0.82)" fill="none" stroke="#ff3347" stroke-opacity="0.55">
    <circle r="190" stroke-width="2"/>
    <ellipse rx="190" ry="64" stroke-opacity="0.35"/>
    <ellipse rx="190" ry="128" stroke-opacity="0.25"/>
    <ellipse rx="64" ry="190" stroke-opacity="0.35"/>
    <ellipse rx="128" ry="190" stroke-opacity="0.25"/>
    <line x1="-190" x2="190" stroke-opacity="0.3"/>
    <ellipse rx="260" ry="70" stroke="#ff8a94" stroke-opacity="0.45" transform="rotate(-18)"/>
    <g fill="#ff3347" stroke="none">
      <circle cx="-120" cy="-80" r="5"/><circle cx="60" cy="-140" r="4"/><circle cx="140" cy="40" r="5"/>
      <circle cx="-40" cy="110" r="4"/><circle cx="-160" cy="30" r="3"/><circle cx="245" cy="-60" r="6" fill="#ff8a94"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="150" fill="#ff3347" font-size="22" letter-spacing="6" font-family="Consolas, 'Courier New', monospace">AI · ML · WEB DEVELOPMENT</text>
    <text x="80" y="250" fill="#f2f2f3" font-size="72" font-weight="700">MUHAMMAD <tspan fill="#ff2a3d">TAHA</tspan></text>
    <rect x="80" y="282" width="140" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="350" fill="#f2f2f3" font-size="34" font-weight="500">I build AI automations, ML systems</text>
    <text x="80" y="396" fill="#f2f2f3" font-size="34" font-weight="500">and websites that save businesses time.</text>
    <text x="80" y="470" fill="#a3a3ab" font-size="24">Mechatronics Engineer (NUST) · IEEE co-author</text>
    <text x="80" y="540" fill="#34d399" font-size="22">● Available for freelance &amp; remote work</text>
    <text x="80" y="580" fill="#6e6e76" font-size="20" font-family="Consolas, 'Courier New', monospace">mtaha2588.github.io</text>
  </g>
